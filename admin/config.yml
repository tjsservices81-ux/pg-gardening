# Decap CMS configuration — the admin panel at /admin
#
# Everything edited here is committed straight back to this repository, which
# makes Netlify rebuild the site. That means there is no database to lose, every
# change is version-controlled, and you can undo anything from the commit
# history.
#
# Before it will let anyone in, two switches have to be turned on once in the
# Netlify dashboard. See ADMIN.md.

backend:
  name: git-gateway
  # The branch Netlify deploys the live site from. If this ever points at a
  # branch the site is not built from, the panel will appear to save fine and
  # nothing will change on the website.
  branch: main
  commit_messages:
    create: 'Admin: add {{collection}} "{{slug}}"'
    update: 'Admin: update {{collection}} "{{slug}}"'
    delete: 'Admin: delete {{collection}} "{{slug}}"'
    uploadMedia: 'Admin: upload {{path}}'
    deleteMedia: 'Admin: delete {{path}}'

# Where uploaded photos land, and how the site refers to them
media_folder: assets/img/uploads
public_folder: /assets/img/uploads

# Saving publishes straight away. There is no draft stage to forget about —
# the on/off switches inside each item do that job instead.
publish_mode: simple

locale: en

collections:
  # ---------------------------------------------------------------- reviews
  #
  # Every label and hint below is written for somebody who has never used a
  # content editor. The rule throughout: say what the box does AND where the
  # result turns up on the website, because "which service" means nothing on
  # its own and "shows on the Hedge Cutting page" means everything.
  - name: reviews
    label: Reviews
    label_singular: review
    description: >-
      Reviews customers leave through the form on your website land here
      switched OFF, waiting for you. Nothing appears on the site until you
      switch it on yourself. Once you do, it shows on the Reviews page, and
      the three newest also show on the home page.
    folder: content/reviews
    create: true
    identifier_field: name
    slug: '{{year}}-{{month}}-{{day}}-{{fields.name}}'
    summary: '{{fields.name}} — {{fields.area}}'
    sortable_fields: ['date', 'name', 'approved']
    # No preview pane. It is meant for a wide screen, where it shows the page
    # updating as you type. On a phone it takes half the width and fills it
    # with raw page markup, squeezing the form into what is left.
    editor:
      preview: false
    extension: json
    format: json
    view_filters:
      - label: Waiting for you to approve
        field: approved
        pattern: false
      - label: Already on the website
        field: approved
        pattern: true
    fields:
      - label: 'Show this review on the website'
        name: approved
        widget: boolean
        default: false
        hint: >-
          OFF means nobody but you can see it. Switch it ON and press Publish
          and it appears on the Reviews page within a minute or two — and on
          the home page too if it is one of the three newest.
      - label: Their name
        name: name
        widget: string
        hint: 'First name and the initial of the surname is plenty — Sarah T.'
      - label: Their town or village
        name: area
        widget: string
        required: false
        hint: 'Printed next to the name, like "Sarah T., Wilpshire". Leave empty if you would rather not.'
      - label: What job did you do for them
        name: service
        widget: select
        required: false
        options:
          - { label: Tree surgery, value: tree-surgery }
          - { label: Hedge cutting, value: hedge-cutting }
          - { label: Garden work, value: garden-work }
          - { label: Power washing, value: power-washing }
        hint: 'Printed under the review, and lets visitors filter the Reviews page by job.'
      - label: How many stars
        name: rating
        widget: number
        value_type: int
        min: 1
        max: 5
        default: 5
        hint: 'A number from 1 to 5. Draws the row of stars.'
      - label: When was it
        name: date
        # Decap 3 has no "date" widget — it was removed, and asking for one
        # renders no field at all, which is why this box was missing. The
        # datetime widget with the time switched off is the replacement.
        # picker_utc stops a late-evening entry being stored as the day before.
        widget: datetime
        date_format: 'DD/MM/YYYY'
        time_format: false
        format: 'YYYY-MM-DD'
        picker_utc: true
        hint: >-
          Defaults to today, which is right if you are typing it in as they tell
          you. Reviews are listed newest first, so this is what decides where it
          sits on the page.
        required: true
      - label: What they said
        name: text
        widget: text
        hint: >-
          Type it exactly as they said it. Do not tidy their words up — a
          review has to be the customer's own words, and that is the law
          rather than my opinion.
      - label: 'They are happy for it to be on the website'
        name: consent
        widget: boolean
        default: true
        hint: >-
          Different from the switch at the top. Turn this OFF and the review
          is never shown no matter what — for when somebody later asks you to
          take theirs down but you would rather not delete it.
      - label: Private notes for yourself
        name: notes
        widget: text
        required: false
        hint: 'Never printed on the website. Nobody but you sees this.'

  # -------------------------------------------------------- before / after
  - name: pairs
    label: Before & after sliders
    label_singular: before & after slider
    description: >-
      The pictures visitors drag across to see the difference. Add one here and
      it appears in FOUR places at once — the Gallery page, the page for
      whichever job you pick, all 17 town pages, and the newest one sits right
      under the photo at the top of the home page.
    folder: content/pairs
    create: true
    identifier_field: title
    slug: '{{fields.service}}-{{slug}}'
    summary: '{{fields.title}}'
    editor:
      preview: false
    extension: json
    format: json
    fields:
      - label: 'Show this on the website'
        name: published
        widget: boolean
        default: true
        hint: >-
          Leave it ON and it goes live when you press Publish. Turn it OFF to
          take it off the website without deleting it — you can put it back
          any time.
      - label: Which job is it
        name: service
        widget: select
        options:
          - { label: Tree surgery, value: tree-surgery }
          - { label: Hedge cutting, value: hedge-cutting }
          - { label: Garden work, value: garden-work }
          - { label: Power washing, value: power-washing }
        hint: >-
          This picks which service page it shows on. Choose Hedge cutting and
          it appears on the Hedge Cutting page. It goes on the Gallery page
          and the town pages whichever you pick.
      - label: Give it a short name
        name: title
        widget: string
        hint: >-
          A few words, printed underneath the slider. "Conifer hedge reduced",
          "Front drive washed". Not your customer's name or address.
      - label: The BEFORE photo — the messy one
        name: before
        widget: image
        hint: >-
          Take this one standing in the same spot as the after photo. The
          slider wipes one picture across the other, so if you moved a long
          way between the two it just looks like two unrelated photos.
      - label: The AFTER photo — the finished one
        name: after
        widget: image
        hint: 'Same spot, same distance, same direction as the before photo.'
      - label: A line about the job
        name: caption
        widget: text
        required: false
        hint: 'Optional. Printed under the slider. Leave it empty and nothing is shown.'
      - label: Describe the photo for blind visitors
        name: alt
        widget: string
        required: false
        hint: >-
          Optional. Read aloud to anyone using a screen reader, and shown if
          the picture fails to load. "An overgrown conifer hedge over a
          driveway" is the sort of thing.

  # ---------------------------------------------------------------- photos
  - name: photos
    label: Photos
    label_singular: photo
    description: >-
      One-off photos of finished work — no before shot needed. Add one here and
      it appears in THREE places — the Gallery page, the page for whichever job
      you pick, and the row of recent photos on the home page. Adding a lot at
      once is quicker through GitHub; PHOTOS.md explains how.
    folder: content/photos
    create: true
    # Captions are optional on a single photo, so the filename is built from
    # the service and the time it was added rather than from the words in it.
    slug: '{{fields.service}}-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}'
    summary: '{{fields.caption}}'
    editor:
      preview: false
    extension: json
    format: json
    fields:
      - label: 'Show this on the website'
        name: published
        widget: boolean
        default: true
        hint: >-
          Leave it ON and it goes live when you press Publish. Turn it OFF to
          hide it without deleting it.
      - label: Which job is it
        name: service
        widget: select
        options:
          - { label: Tree surgery, value: tree-surgery }
          - { label: Hedge cutting, value: hedge-cutting }
          - { label: Garden work, value: garden-work }
          - { label: Power washing, value: power-washing }
        hint: >-
          This picks which service page it shows on. Choose Power washing and
          it appears on the Power Washing page. It goes on the Gallery page
          either way.
      - label: The photo
        name: image
        widget: image
        hint: >-
          Straight off your phone is fine. Try to keep house numbers, car
          number plates and people out of the frame — that is a promise the
          privacy policy makes to your customers.
      - label: A line about it
        name: caption
        widget: string
        required: false
        hint: 'Optional. Printed underneath the photo. "Beech hedge, Wilpshire".'
      - label: Describe the photo for blind visitors
        name: alt
        widget: string
        required: false
        hint: >-
          Optional. Read aloud to anyone using a screen reader, and shown if
          the picture fails to load.

  # -------------------------------------------------------------- settings
  - name: settings
    label: Links & switches
    editor:
      preview: false
    description: >-
      Your Facebook pages, your Google listing, and the trade directories like
      Bark and MyBuilder. These appear in the footer of every page, and under
      "Listed elsewhere" on the Reviews page and the Contact page.
    files:
      - name: links
        label: Links & switches
        file: content/settings.json
        extension: json
        format: json
        fields:
          - label: Facebook pages
            name: facebook
            widget: list
            label_singular: Facebook page
            summary: '{{fields.label}}'
            hint: >-
              Shown in the footer of every page and on the Contact page. Turn
              one off and the button disappears completely rather than sitting
              there doing nothing.
            fields:
              - { label: 'Show this one on the website', name: enabled, widget: boolean, default: true }
              - { label: 'What the button should say', name: label, widget: string, hint: 'e.g. "PG Gardening on Facebook"' }
              - { label: 'The address of the page', name: url, widget: string, hint: 'Open the page on a computer and copy what is in the address bar.' }

          - label: Google
            name: google
            widget: object
            hint: >-
              Powers every "read our reviews on Google" and "find us on Google
              Maps" button. Anything left empty is simply not shown. See
              GOOGLE-SETUP.md for where to find each one.
            fields:
              - { label: 'Link to your reviews on Google', name: reviewsUrl, widget: string, required: false, hint: 'Used by the "Read our Google reviews" buttons.' }
              - { label: 'One-tap link for leaving a review', name: writeUrl, widget: string, required: false, hint: 'Looks like g.page/r/…/review. Opens the review box straight away — the most valuable link on the whole site.' }
              - { label: 'Link to you on Google Maps', name: mapsUrl, widget: string, required: false }
              - { label: 'Google Place ID', name: placeId, widget: string, required: false, hint: 'Only needed if live Google reviews are ever switched on. Safe to leave empty.' }

          - label: Google Analytics ID
            name: ga4Id
            widget: string
            required: false
            hint: >-
              Looks like G-XXXXXXXXXX. Leave it empty and no tracking is loaded
              at all, which is one less thing the cookie banner has to explain.

          - label: Trade directories and review sites
            name: directories
            widget: list
            label_singular: directory
            summary: '{{fields.name}}'
            hint: >-
              Bark, MyBuilder, Checkatrade and the rest. They all start switched
              OFF. When you sign up to one, paste your profile link in and
              switch it on — it then appears under "Listed elsewhere" on the
              Reviews page and the Contact page. Only switch on the ones you are
              genuinely listed on; a link to a profile that does not exist is
              worse than no link.
            fields:
              - { label: 'Show this one on the website', name: enabled, widget: boolean, default: false }
              - { label: 'What the button should say', name: name, widget: string }
              - { label: 'Link to your profile on that site', name: url, widget: string, required: false }
              - { label: 'Private note for yourself', name: note, widget: string, required: false, hint: 'Never shown on the website.' }
