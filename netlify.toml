# Netlify configuration — PG Gardening & Tree Surgeon
#
# The site is plain static HTML: there is no framework and nothing to compile.
# The one build step turns everything editable — settings, reviews, photos and
# before/after pairs — into the small data files the pages read. Saving anything
# in the admin panel at /admin commits to this repository, which starts a
# deploy, which runs this. See ADMIN.md and PHOTOS.md.

[build]
  command = "node tools/build-content.mjs"
  publish = "."
  functions = "netlify/functions"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Long cache on images is safe only because they are added rather than
# replaced. A replaced file keeps serving from a visitor's cache for a month,
# which stopped being theoretical when the insurance certificate was swapped
# for a redacted copy with the address stamped out — anyone holding the old one
# would have kept it. The fix is to change the filename, never the contents:
# the insurance certificate is now named for its policy period, so next year's
# renewal gets a new name for free.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# CSS and JS change often and carry no fingerprint in their filenames, so a
# long cache means a returning visitor gets today's HTML with yesterday's
# stylesheet — which is not "slightly stale", it is a broken-looking page.
# That is exactly what happened when the certificates button went up: correct
# markup, no matching styles, unstyled text sat across the hero.
#
# max-age=0 with must-revalidate does not mean "download every time". The
# browser asks whether its copy is still good, Netlify answers with a 304 and
# no body when nothing has changed. The cost is one small round trip; the
# benefit is that a fix is never a day late.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# photo-manifest.js is regenerated on every deploy — never cache it hard.
[[headers]]
  for = "/assets/js/photo-manifest.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[redirects]]
  from = "/services"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/areas"
  to = "/areas/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
